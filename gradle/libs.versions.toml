[versions]
jvm-toolchain = "24"
kotlin = "2.2.20"

androidx-lifecycle = "2.9.5"
composeHotReload = "1.0.0-rc02"
composeMultiplatform = "1.9.1"
junit = "4.13.2"
kotlinx-coroutines = "1.10.2"
kotlinxSerializationJson = "1.9.0"
forge = "0.1.1"
material3 = "1.10.0-alpha04"
koinBom = "4.1.1"
ksp = "2.2.20-2.0.3"
gobley = "0.3.7"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }

forge-usecase = { module = "com.skash.forge:usecase", version.ref = "forge" }
forge-datastore-api = { module = "com.skash.forge:datastore-api", version.ref = "forge" }
forge-multiplatform-settings = { module = "com.skash.forge:datastore-multiplatform-settings", version.ref = "forge" }
forge-viewmodel = { module = "com.skash.forge:viewmodel", version.ref = "forge" }
forge-event = { module = "com.skash.forge:event", version.ref = "forge" }
forge-navigation-api = { module = "com.skash.forge:navigation-api", version.ref = "forge" }
forge-navigation-nav2 = { module = "com.skash.forge:navigation-nav2", version.ref = "forge" }

androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koinBom" }
koin-compose = { module = "io.insert-koin:koin-compose" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }

compose-gradlePlugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "composeMultiplatform" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }

kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

[plugins]
composeHotReload = { id = "org.jetbrains.compose.hot-reload", version.ref = "composeHotReload" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlinMultiplatformLibrary = { id = "org.jetbrains.kotlin.multiplatform.library", version.ref = "kotlin" }

composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
cargo = { id = "dev.gobley.cargo", version.ref = "gobley" }
uniffi = { id = "dev.gobley.uniffi", version.ref = "gobley" }
rust = { id = "dev.gobley.rust", version = "0.3.7" }
sweeper-internal-kmp-module = { id = "sweeper.internal.kmp.module" }
sweeper-internal-compose-module = { id = "sweeper.internal.compose.module" }
